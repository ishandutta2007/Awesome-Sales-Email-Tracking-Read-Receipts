<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <!-- Keyframe Animations -->
    <style>
      .pulse-glow {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .signal-flow {
        stroke-dasharray: 8 6;
        animation: dash 20s linear infinite;
      }
      .node-ping {
        animation: ping 2.5s cubic-bezier(0, 0, 0.2, 1) infinite;
        transform-origin: center;
      }
      .card-float {
        animation: float 6s ease-in-out infinite alternate;
      }
      .card-float-delayed {
        animation: float 6s ease-in-out infinite alternate;
        animation-delay: -3s;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -200;
        }
      }
      @keyframes pulse {
        0% { opacity: 0.35; transform: scale(0.98); }
        100% { opacity: 0.75; transform: scale(1.02); }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="340" rx="16" fill="url(#techGrid)" />

  <!-- Dynamic Ambient Glowing Orbs (in background) -->
  <circle cx="200" cy="70" r="150" fill="url(#glowGrad)" class="pulse-glow" filter="blur(40px)" />
  <circle cx="1020" cy="240" r="180" fill="url(#glowGrad)" class="pulse-glow" filter="blur(40px)" />

  <!-- Animated Data Connection Streams (behind main cards & text) -->
  <path d="M 100 280 C 350 240, 480 300, 750 250 S 1050 280, 1150 180" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" class="signal-flow" />
  <path d="M 50 120 C 300 160, 500 80, 800 130 S 1000 60, 1150 100" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.25" class="signal-flow" />

  <!-- Dynamic HUD Metric Cards (Right Side / Accent graphics) -->
  <g class="card-float" transform="translate(860, 45)">
    <rect width="280" height="96" rx="12" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1.5" />
    <circle cx="36" cy="48" r="18" fill="#0284c7" fill-opacity="0.2" />
    <path d="M 28 48 L 34 54 L 46 41" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 33 48 L 38 53 L 49 42" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.6" />
    <text x="68" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">DOUBLE READ RECEIPT</text>
    <text x="68" y="66" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700">Verified Open &amp; Click</text>
  </g>

  <g class="card-float-delayed" transform="translate(890, 165)">
    <rect width="260" height="96" rx="12" fill="#1e293b" fill-opacity="0.75" stroke="#475569" stroke-width="1.5" />
    <circle cx="36" cy="48" r="18" fill="#10b981" fill-opacity="0.18" />
    <!-- Dynamic Pulse radar -->
    <circle cx="36" cy="48" r="8" fill="#10b981" />
    <path d="M 36 34 A 14 14 0 0 1 50 48" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
    <text x="68" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">TELEMETRY INGEST</text>
    <text x="68" y="66" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">&lt; 12ms Pixel Latency</text>
  </g>

  <!-- FOREGROUND: Titles and Badges (Always crisp and strictly in foreground) -->
  <g transform="translate(70, 0)">
    <!-- Category Pill Tag -->
    <g transform="translate(0, 52)">
      <rect width="268" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1">SALES &amp; EMAIL OBSERVABILITY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="140" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="37" font-weight="800" letter-spacing="-0.5">
      Awesome Sales Email Tracking
    </text>
    <text x="0" y="185" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      &amp; Read Receipts
    </text>

    <!-- Subtitle -->
    <text x="0" y="226" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400">
      Curated ecosystem of SaaS leaders, open-source pixel trackers, and MPP-proof engagement suites.
    </text>

    <!-- Interactive / Status Pills -->
    <g transform="translate(0, 256)">
      <!-- Pill 1 -->
      <rect width="135" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">📊 10+ SaaS Audited</text>

      <!-- Pill 2 -->
      <rect x="145" y="0" width="165" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="157" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🛡️ Apple MPP Detection</text>

      <!-- Pill 3 -->
      <rect x="320" y="0" width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="332" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">⚡ Open Source Tools</text>
    </g>
  </g>
</svg>
